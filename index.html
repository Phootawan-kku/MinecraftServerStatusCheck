<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plub &amp; Friend Survival Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="">

<header class="scene">
  <canvas id="sky" width="320" height="120" aria-hidden="true"></canvas>
  <div class="clouds" id="clouds" aria-hidden="true"></div>
  <div class="scene-inner">
    <div>
      <h1 id="title"></h1>
      <p class="sub">Live server status</p>
    </div>
    <div class="pill"><span class="dot"></span><span id="status">Checking...</span></div>
  </div>
</header>

<main>
  <section class="card hero" aria-live="polite">
    <div class="server">
      <img class="icon" id="icon" alt="Server icon">
      <div>
        <p class="motd" id="motd">Contacting server...</p>
        <p class="meta" id="meta"></p>
        <div class="actions">
          <span class="addr" id="address"></span>
          <button class="primary" id="copy" type="button">Copy address</button>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </div>
    </div>
    <div class="stat">
      <div class="big" id="count">-</div>
      <div class="stat-label"><span id="countLabel">players online</span><span id="pct"></span></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <h2>Who's online <span class="badge" id="badge">0</span></h2>
      <input type="search" id="search" placeholder="Search players" aria-label="Search players" hidden>
    </div>
    <div class="grid" id="players"></div>
    <div class="note" id="note"></div>
  </section>

  <div class="foot">
    <span id="updated">Last checked: -</span>
    <span id="next"></span>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
