<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plub &amp; Friend Survival Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2419;
    --ink-2: #566451;
    --paper: #eef1ea;
    --paper-2: #e0e5db;
    --line: #cdd5c7;
    --emerald: #2e9e47;
    --emerald-d: #1d6a31;
    --bad: #d9483b;
    --dirt: #4e3620;
    --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pixel: 'Press Start 2P', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background-color: var(--dirt);
    background-size: 128px 128px;
    image-rendering: pixelated;
  }

  /* ---------- Landscape ---------- */
  .scene { position: relative; height: clamp(320px, 44vw, 430px); overflow: hidden; background: #5fb0e8; }
  body.offline .scene { background: #0c1233; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; image-rendering: pixelated; }
  .scene::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
    background: linear-gradient(to bottom, rgba(30,18,8,0), rgba(30,18,8,.6));
    pointer-events: none;
  }
  .clouds { position: absolute; inset: 0; overflow: hidden; transition: opacity 1s; pointer-events: none; }
  body.offline .clouds { opacity: 0; }
  .cloud { position: absolute; left: -260px; image-rendering: pixelated; animation: drift linear infinite; }
  @keyframes drift { to { transform: translateX(calc(100vw + 520px)); } }

  .scene-inner {
    position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 36px 20px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
  }
  h1 {
    margin: 0; font-family: var(--pixel); font-weight: 400;
    font-size: clamp(17px, 3.4vw, 30px); line-height: 1.55; color: #fff; max-width: 620px;
    text-shadow: 3px 3px 0 #1d3345, 0 0 24px rgba(10,30,50,.35);
  }
  .sub { margin: 12px 0 0; color: #fff; font-weight: 500; font-size: 16px; text-shadow: 0 1px 8px rgba(10,30,50,.55); }
  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px;
    border-radius: 999px; background: rgba(255,255,255,.93); backdrop-filter: blur(6px);
    font-weight: 600; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.2);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9aa596; }
  body.online .dot { background: var(--emerald); animation: pulse 2s infinite; }
  body.offline .dot { background: var(--bad); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,158,71,.6); }
    70% { box-shadow: 0 0 0 9px rgba(46,158,71,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,158,71,0); }
  }

  /* ---------- Content ---------- */
  main { position: relative; z-index: 3; max-width: 980px; margin: -70px auto 0; padding: 0 20px 56px; }
  .card {
    background: var(--paper); border-radius: 22px; padding: 28px;
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 24px 48px -12px rgba(0,0,0,.55);
    margin-bottom: 20px;
  }

  .hero { display: grid; grid-template-columns: 1fr 290px; gap: 32px; align-items: center; }
  .server { display: flex; gap: 20px; align-items: flex-start; }
  .icon {
    width: 84px; height: 84px; flex: none; border-radius: 16px; image-rendering: pixelated;
    background: var(--paper-2); box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--line), 0 8px 16px rgba(0,0,0,.15);
  }
  .motd { margin: 2px 0 4px; font-size: 19px; font-weight: 600; white-space: pre-line; line-height: 1.35; }
  .meta { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; min-height: 21px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .addr {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; font-weight: 600;
    padding: 10px 14px; border-radius: 12px; background: var(--paper-2); color: var(--emerald-d);
  }
  button {
    font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 12px;
    padding: 10px 16px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    transition: background .15s, transform .1s, border-color .15s;
  }
  button:hover { background: #f6f8f3; border-color: #b4bfad; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  button.primary:hover { background: #2c3a28; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--emerald); outline-offset: 2px; }

  .stat { padding-left: 32px; border-left: 1px solid var(--line); }
  .big { font-family: var(--pixel); font-size: 46px; line-height: 1; letter-spacing: -2px; }
  .big small { font-size: 18px; letter-spacing: 0; color: var(--ink-2); }
  .stat-label { margin: 10px 0 14px; color: var(--ink-2); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }

  /* hotbar-style capacity meter */
  .bar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
  .bar span {
    height: 18px; border-radius: 3px; background: var(--paper-2); box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
    transition: background .4s, box-shadow .4s;
  }
  .bar span.on {
    background: var(--emerald);
    box-shadow: inset 0 -3px 0 var(--emerald-d), inset 0 2px 0 rgba(255,255,255,.35);
  }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .head h2 { margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .badge { background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; padding: 2px 11px; border-radius: 99px; }
  input[type=search] {
    font-family: var(--sans); font-size: 14px; color: var(--ink); width: 220px;
    padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 12px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 18px 8px 14px; border-radius: 18px; background: var(--paper-2);
    transition: transform .15s, background .15s;
  }
  .tile:hover { transform: translateY(-3px); background: #d6ddd0; }
  .tile img {
    width: 64px; height: 64px; image-rendering: pixelated; border-radius: 8px; background: #bfc8b8;
    box-shadow: 0 6px 0 -2px rgba(0,0,0,.14);
  }
  .tag {
    max-width: 100%; padding: 3px 8px; border-radius: 4px; background: rgba(20,24,18,.82);
    color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .skeleton {
    height: 138px; border-radius: 18px;
    background: linear-gradient(90deg, var(--paper-2) 25%, #e9eee4 50%, var(--paper-2) 75%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .note { color: var(--ink-2); padding: 4px 0; }

  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: #d8c3a5; font-size: 14px; padding: 0 6px; }

  @media (max-width: 760px) {
    .scene-inner { padding-top: 24px; flex-direction: column-reverse; align-items: flex-start; gap: 16px; }
    .hero { grid-template-columns: 1fr; gap: 24px; }
    .stat { padding: 22px 0 0; border-left: 0; border-top: 1px solid var(--line); }
    .server { flex-direction: column; }
    .card { padding: 22px; }
    input[type=search] { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; left: 12%; }
    .cloud:nth-child(2) { left: 55%; }
    .cloud:nth-child(3) { left: 80%; }
    *, *::before, *::after { transition: none !important; }
    .dot, .skeleton { animation: none !important; }
  }
</style>
</head>
<body class="">

<header class="scene">
  <canvas id="sky" width="320" height="120" aria-hidden="true"></canvas>
  <div class="clouds" id="clouds" aria-hidden="true"></div>
  <div class="scene-inner">
    <div>
      <h1 id="title"></h1>
      <p class="sub">Live server status</p>
    </div>
    <div class="pill"><span class="dot"></span><span id="status">Checking...</span></div>
  </div>
</header>

<main>
  <section class="card hero" aria-live="polite">
    <div class="server">
      <img class="icon" id="icon" alt="Server icon">
      <div>
        <p class="motd" id="motd">Contacting server...</p>
        <p class="meta" id="meta"></p>
        <div class="actions">
          <span class="addr" id="address"></span>
          <button class="primary" id="copy" type="button">Copy address</button>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </div>
    </div>
    <div class="stat">
      <div class="big" id="count">-</div>
      <div class="stat-label"><span id="countLabel">players online</span><span id="pct"></span></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <h2>Who's online <span class="badge" id="badge">0</span></h2>
      <input type="search" id="search" placeholder="Search players" aria-label="Search players" hidden>
    </div>
    <div class="grid" id="players"></div>
    <div class="note" id="note"></div>
  </section>

  <div class="foot">
    <span id="updated">Last checked: -</span>
    <span id="next"></span>
  </div>
</main>

<script>
/* ===== Settings ===== */
const SERVER_HOST = "138.2.92.246";
const SERVER_PORT = 25566;
const SERVER_NAME = "Plub & Friend Survival Server";
const REFRESH_SECONDS = 30;
/* ==================== */

const ADDRESS = SERVER_HOST + ":" + SERVER_PORT;
const $ = id => document.getElementById(id);
let currentList = [];

/* ---------- Procedural pixel art ---------- */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function drawScene(night) {
  const c = $("sky"), g = c.getContext("2d");
  const W = c.width, H = c.height, rnd = mulberry(11);
  const px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

  // sky in visible steps
  const top = night ? [8, 12, 38] : [78, 164, 232];
  const bot = night ? [44, 70, 128] : [208, 240, 253];
  const bands = 16;
  for (let i = 0; i < bands; i++) {
    px(0, Math.floor(i * 6), W, 7, rgb(lerp(top, bot, i / (bands - 1))));
  }
  px(0, bands * 6, W, H, rgb(bot));

  if (night) {
    for (let i = 0; i < 80; i++) {
      const a = (0.35 + rnd() * 0.65).toFixed(2);
      px(Math.floor(rnd() * W), Math.floor(rnd() * 72), 1, 1, `rgba(255,255,255,${a})`);
    }
    px(240, 10, 24, 24, "rgba(220,230,255,.12)");
    px(246, 14, 12, 12, "#e9edf7");
    px(249, 18, 2, 2, "#c3cadb"); px(253, 21, 3, 2, "#c3cadb"); px(248, 22, 2, 2, "#d3d9e8");
  } else {
    px(238, 8, 28, 28, "rgba(255,240,150,.22)");
    px(244, 14, 16, 16, "#fff3a6");
    px(246, 16, 12, 12, "#ffd83a");
  }

  // hills
  const far = night ? "#15234a" : "#86b9ae";
  const mid = night ? "#0f2038" : "#58a04c";
  for (let x = 0; x < W; x++) {
    const yf = Math.round(66 + Math.sin(x / 29) * 7 + Math.sin(x / 11 + 1) * 3);
    px(x, yf, 1, H - yf, far);
    const ym = Math.round(77 + Math.sin(x / 19 + 2) * 5 + Math.sin(x / 7) * 1.5);
    px(x, ym, 1, H - ym, mid);
  }

  // ground
  const gy = x => 90 + Math.round(Math.sin(x / 17) * 2 + Math.sin(x / 6));
  const grass = night ? ["#2c5a2a", "#27502a", "#33652f"] : ["#6bbf42", "#5fae3a", "#7acc4f"];
  const dirt = night ? [60, 42, 28] : [124, 86, 52];
  for (let x = 0; x < W; x++) {
    const y0 = gy(x);
    px(x, y0, 1, 2, grass[Math.floor(rnd() * 3)]);
    for (let y = y0 + 2; y < H; y++) {
      const d = Math.floor((rnd() - 0.5) * 26);
      let col = rgb([dirt[0] + d, dirt[1] + d, dirt[2] + d]);
      if (rnd() < 0.025) col = night ? "#3d3f46" : "#8e9096";
      px(x, y, 1, 1, col);
    }
  }

  // trees
  const leafCols = night ? ["#143a1c", "#1b4a24", "#10331a"] : ["#2e7d32", "#3a8f3a", "#276b2b"];
  const leaves = (x0, y0, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      px(x0 + x, y0 + y, 1, 1, leafCols[Math.floor(rnd() * 3)]);
    }
  };
  [26, 74, 138, 196, 292].forEach(base => {
    const x = base + Math.floor(rnd() * 8);
    const y = gy(x);
    px(x, y - 8, 2, 8, night ? "#3b2713" : "#5d3b1e");
    leaves(x - 3, y - 13, 8, 4);
    leaves(x - 2, y - 17, 6, 4);
    leaves(x - 1, y - 19, 4, 2);
  });
}

function cloudImg(seed) {
  const rnd = mulberry(seed);
  const c = document.createElement("canvas");
  c.width = 22; c.height = 9;
  const g = c.getContext("2d");
  const body = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  body(2, 4, 18, 4, "#ffffff");
  body(5, 2, 7 + Math.floor(rnd() * 3), 3, "#ffffff");
  body(11, 1, 6, 4, "#ffffff");
  body(2, 7, 18, 1, "#dcebf6");
  return c.toDataURL();
}

function dirtTile() {
  const c = document.createElement("canvas");
  c.width = c.height = 16;
  const g = c.getContext("2d");
  const rnd = mulberry(5);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const d = Math.floor((rnd() - 0.5) * 22);
    g.fillStyle = `rgb(${78 + d},${54 + d},${32 + d})`;
    g.fillRect(x, y, 1, 1);
    if (rnd() < 0.03) { g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(x, y, 1, 1); }
  }
  return c.toDataURL();
}

function grassBlock() {
  const c = document.createElement("canvas");
  c.width = c.height = 16;
  const g = c.getContext("2d");
  const rnd = mulberry(3);
  const j = (v, s) => Math.max(0, Math.min(255, v + Math.floor((rnd() - .5) * s)));
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const topSide = y < 5 || (y < 7 && rnd() < .45);
    const r = topSide ? [92, 160, 56] : [134, 96, 58];
    g.fillStyle = `rgb(${j(r[0], 34)},${j(r[1], 34)},${j(r[2], 34)})`;
    g.fillRect(x, y, 1, 1);
  }
  return c.toDataURL();
}

/* ---------- Setup ---------- */
document.body.style.backgroundImage = `url(${dirtTile()})`;
$("icon").src = grassBlock();
$("title").textContent = SERVER_NAME;
document.title = SERVER_NAME + " - Status";
$("address").textContent = ADDRESS;
drawScene(false);

[{ top: "14%", w: 170, dur: 110, delay: -20, seed: 1 },
 { top: "30%", w: 120, dur: 150, delay: -90, seed: 2 },
 { top: "8%",  w: 140, dur: 190, delay: -150, seed: 3 }].forEach(o => {
  const img = document.createElement("img");
  img.className = "cloud";
  img.alt = "";
  img.src = cloudImg(o.seed);
  img.style.cssText = `top:${o.top};width:${o.w}px;animation-duration:${o.dur}s;animation-delay:${o.delay}s`;
  $("clouds").append(img);
});

const BAR_SLOTS = 20;
for (let i = 0; i < BAR_SLOTS; i++) $("bar").append(document.createElement("span"));

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(ADDRESS); $("copy").textContent = "Copied"; }
  catch { $("copy").textContent = "Press Ctrl+C"; }
  setTimeout(() => $("copy").textContent = "Copy address", 1600);
});

/* ---------- Data ---------- */
async function fetchStatus() {
  try {
    const r = await fetch(`https://api.mcsrvstat.us/3/${ADDRESS}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    return {
      online: !!d.online,
      motd: d.motd && d.motd.clean ? d.motd.clean.join("\n") : "",
      online_n: d.players ? d.players.online : 0,
      max_n: d.players ? d.players.max : 0,
      list: d.players && d.players.list ? d.players.list.map(p => p.name) : null,
      version: d.version || "",
      software: d.software || "",
      icon: d.icon || null
    };
  } catch (e1) {
    const r = await fetch(`https://api.mcstatus.io/v2/status/java/${ADDRESS}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    return {
      online: !!d.online,
      motd: d.motd ? d.motd.clean : "",
      online_n: d.players ? d.players.online : 0,
      max_n: d.players ? d.players.max : 0,
      list: d.players && d.players.list ? d.players.list.map(p => p.name_clean) : null,
      version: d.version ? d.version.name_clean : "",
      software: "",
      icon: d.icon || null
    };
  }
}

/* ---------- Rendering ---------- */
let sceneNight = false;
function setMode(online) {
  document.body.className = online ? "online" : "offline";
  const night = !online;
  if (night !== sceneNight) { sceneNight = night; drawScene(night); }
}

function drawPlayers() {
  const grid = $("players");
  const q = $("search").value.trim().toLowerCase();
  grid.textContent = "";
  currentList.filter(n => n.toLowerCase().includes(q)).forEach(name => {
    const el = document.createElement("div");
    el.className = "tile";
    const img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    img.src = `https://mc-heads.net/avatar/${encodeURIComponent(name)}/128`;
    img.onerror = () => { img.onerror = null; img.src = "https://mc-heads.net/avatar/MHF_Steve/128"; };
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = name;
    tag.title = name;
    el.append(img, tag);
    grid.append(el);
  });
}
$("search").addEventListener("input", drawPlayers);

function setBar(filled) {
  [...$("bar").children].forEach((s, i) => s.classList.toggle("on", i < filled));
}

function render(s) {
  setMode(s.online);
  $("status").textContent = s.online ? "Online" : "Offline";
  $("motd").textContent = s.online ? (s.motd || SERVER_NAME) : "The server is not responding right now.";
  $("meta").textContent = s.online ? [s.version, s.software].filter(Boolean).join("  |  ") : "";
  if (s.icon) $("icon").src = s.icon;

  const pct = s.online && s.max_n ? Math.min(1, s.online_n / s.max_n) : 0;
  $("count").innerHTML = s.online ? `${s.online_n}<small>/${s.max_n}</small>` : "-";
  $("countLabel").textContent = s.online ? (s.online_n === 1 ? "player online" : "players online") : "offline";
  $("pct").textContent = s.online && s.max_n ? Math.round(pct * 100) + "% full" : "";
  setBar(s.online_n > 0 ? Math.max(1, Math.round(pct * BAR_SLOTS)) : 0);
  $("badge").textContent = s.online ? s.online_n : 0;

  const note = $("note");
  note.textContent = "";
  currentList = s.online && s.list ? s.list : [];
  $("search").hidden = currentList.length < 6;
  if (currentList.length < 6) $("search").value = "";
  drawPlayers();

  if (!s.online) note.textContent = "No players to show while the server is offline.";
  else if (s.online_n === 0) note.textContent = "Nobody is online right now. Be the first to join.";
  else if (!s.list || !s.list.length) note.textContent = `${s.online_n} online, but this server does not share player names.`;
  else if (s.list.length < s.online_n) note.textContent = `Showing ${s.list.length} of ${s.online_n} players. The server only shares part of the list.`;
}

function renderError() {
  setMode(false);
  $("status").textContent = "No data";
  $("motd").textContent = "Could not reach the status service. Check your connection and refresh.";
  $("meta").textContent = "";
  $("count").textContent = "-";
  $("pct").textContent = "";
  setBar(0);
  currentList = [];
  $("players").textContent = "";
  $("note").textContent = "";
}

function skeletons() {
  const grid = $("players");
  grid.textContent = "";
  for (let i = 0; i < 4; i++) { const s = document.createElement("div"); s.className = "skeleton"; grid.append(s); }
}

let remaining = REFRESH_SECONDS, busy = false, first = true;
async function update() {
  if (busy) return;
  busy = true;
  if (first) skeletons();
  try { render(await fetchStatus()); } catch (e) { renderError(); }
  first = false;
  $("updated").textContent = "Last checked: " + new Date().toLocaleTimeString();
  remaining = REFRESH_SECONDS;
  busy = false;
}

setInterval(() => {
  if (busy) return;
  remaining = Math.max(0, remaining - 1);
  $("next").textContent = `Refreshing in ${remaining}s`;
  if (remaining === 0) update();
}, 1000);

$("refresh").addEventListener("click", update);
update();
</script>
</body>
</html>
